# UBench Central Configuration

paths:
  data_dir: "data"
  processed_dir: "data/processed"
  output_dir: "outputs"
  log_dir: "logs"

model:
  image_size: [256, 256]
  num_classes: 10
  
training:
  learning_rate: 1.0e-4
  num_epochs: 100
  k_folds: 5
  random_seed: 42
  # Reproducibility (M6). When true (default), seed_everything is the single
  # owner of cuDNN flags: cudnn.deterministic=True, cudnn.benchmark=False. When
  # false, cudnn.benchmark=True is allowed for speed (non-reproducible). This
  # replaces the old contradiction (hardware_detector set benchmark=True while
  # seed_everything set it False). Overridable via UBENCH_DETERMINISTIC=0/1.
  deterministic: true
  # Subjects (S* directory names) held out from ALL CV folds and evaluated
  # separately as the TEST set (M1). Default empty = no held-out test set (CV
  # only), which is backward-compatible. A real/citable run should reserve 1-2
  # subjects here. Overridable via the TEST_SUBJECTS env var (comma-separated).
  test_subjects: []

# Loss function (Combined Cross-Entropy + Dice). Defaults reproduce the
# previously-hardcoded CombinedLoss(ce_weight=0.5, dice_weight=0.5).
loss:
  ce_weight: 0.5
  dice_weight: 0.5
  # null = uniform (current default); "balanced" = inverse train-fold class
  # frequency (opt-in, recomputed per fold from the training split only); or an
  # explicit list of `num_classes` floats.
  class_weights: null

# Global (default) optimizer recipe. Adam(lr=training.learning_rate,
# betas=(0.9, 0.999), weight_decay=0, grad-clip 1.0). Used by any model not
# assigned to a family below. Accepted names: adam | adamw.
optimizer:
  name: adam
  weight_decay: 0.0
  betas: [0.9, 0.999]
  grad_clip_norm: 1.0

# Global (default) LR scheduler. ReduceLROnPlateau(mode='min', patience=5,
# factor=0.5), stepped once per epoch on the val metric. Accepted names:
# reduce_on_plateau | warmup_cosine (warmup_frac, stepped per optimizer step).
scheduler:
  name: reduce_on_plateau
  patience: 5
  factor: 0.5
  warmup_frac: 0.05

# Per-family optimizer/scheduler recipes (T3.3/UB-18/M4). Identical
# hyperparameters are not fair across architecture families: CNNs keep
# Adam + plateau; transformer-family models (incl. the pretrained encoders)
# use AdamW + linear-warmup→cosine. `model_families` assigns each registered
# model key to a family; `families` defines each family's override (a null
# optimizer/scheduler inherits the global recipe above). A model not listed
# inherits the global recipe; a family name not in `families` is a hard error.
recipes:
  model_families:
    unet: cnn
    transunet: transformer
    swin_unet_plus_plus: transformer
    swin_pretrained: transformer
    transunet_pretrained: transformer
  families:
    # CNN family == the global recipe (declared explicitly for discoverability).
    cnn:
      optimizer: null
      scheduler: null
    # Transformers want decoupled weight decay + a warmup then cosine decay.
    transformer:
      optimizer:
        name: adamw
        weight_decay: 0.05
        betas: [0.9, 0.999]
        grad_clip_norm: 1.0
      scheduler:
        name: warmup_cosine
        warmup_frac: 0.05

# Thermal-domain preprocessing (T3.4/M7). Normalization is applied at LOAD
# time (the .npy store resized Celsius), so this switch is runtime-pure — no
# rebuild needed to change it. `fixed_range` preserves absolute temperature
# (the modality's core signal) by mapping [lo,hi] °C linearly to [0,1];
# `per_image_minmax` is the legacy per-frame mode (destroys absolute temp).
preprocessing:
  normalization: fixed_range
  fixed_range_celsius: [20.0, 40.0]

regions:
  - "background"
  - "Contorno inferior do Rosto"
  - "Sombrancelha esquerda"
  - "Sombrancelha direita"
  - "Nariz"
  - "Olho esquerdo"
  - "Olho direito"
  - "Boca"
  - "Labios"
  - "Testa"
