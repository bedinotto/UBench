# UBench Central Configuration

paths:
  data_dir: "data"
  processed_dir: "data/processed"
  output_dir: "outputs"
  log_dir: "logs"

model:
  image_size: [256, 256]
  num_classes: 10
  
training:
  learning_rate: 1.0e-4
  num_epochs: 100
  k_folds: 5
  random_seed: 42
  # Subjects (S* directory names) held out from ALL CV folds and evaluated
  # separately as the TEST set (M1). Default empty = no held-out test set (CV
  # only), which is backward-compatible. A real/citable run should reserve 1-2
  # subjects here. Overridable via the TEST_SUBJECTS env var (comma-separated).
  test_subjects: []
  batch_sizes:
    # Optional overrides, otherwise hardware_detector takes precedence
    unet: null
    transunet: null
    swin: null

regions:
  - "background"
  - "Contorno inferior do Rosto"
  - "Sombrancelha esquerda"
  - "Sombrancelha direita"
  - "Nariz"
  - "Olho esquerdo"
  - "Olho direito"
  - "Boca"
  - "Labios"
  - "Testa"
