[project]
name = "ubench"
version = "0.1.0"
description = "Thermal facial region segmentation benchmark (U-Net / TransUNet / Swin-UNet++)."
# One authority for dependencies (R5): these mirror the old
# requirements/requirements.txt floors exactly, with torch/torchvision added
# (they are the reason UB-20 exists and must be captured by the lock). The
# CPU/CUDA wheel-index split is resolved at lock time by uv's --torch-backend
# (see requirements/requirements.cpu.lock and codes/setup.py) — NOT by a second
# requirements file. Install from the generated lock, never from these loose
# floors (see CLAUDE.md §3.1).
requires-python = ">=3.10,<3.13"  # GPU boxes 3.10/3.11, CI 3.11, dev/sandbox up to 3.13
dependencies = [
    # Core deep learning
    "torch>=2.0",
    "torchvision>=0.15",
    "torchmetrics>=1.0.0",
    "timm>=1.0",                  # pretrained SwinV2 + R50+ViT-B/16 hybrid, in_chans=1 stem (T3.2/M5)
    # Computer vision & image processing
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "albumentations>=1.4,<2.0",   # <2.0 retained (T3.4); the 2.x A.Affine migration is out of scope
    # Scientific computing
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    # Configuration & serialization
    "PyYAML>=6.0",
    "pydantic>=2",                # typed fail-on-unknown-key schema over codes/config.yaml (UB-12)
    # Progress / visualization
    "tqdm>=4.66.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    # System utilities / hardware detection
    "psutil>=5.9.0",
    "GPUtil>=1.4.0",
    "nvidia-ml-py",
]

[project.optional-dependencies]
# Dev/CI tooling — resolved into the same lock (compiled with --extra dev) so
# CI installs the full test+lint environment with one `uv pip sync`.
dev = [
    "pytest>=7.4.0",
    "ruff",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Minimal critical ruleset — keeps existing code clean without reformatting.
# Tightening the ruleset is deferred to later phases (R3).
#   E9xx  — runtime errors (syntax errors, invalid escape sequences)
#   F63x  — invalid assert / print statements
#   F7xx  — statement-level errors
#   F82x  — undefined names
select = ["E9", "F63", "F7", "F82"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["codes/tests"]
addopts = "-q"
# Full-suite runs write ~10-15 GB of full-state checkpoints into pytest's
# per-run temp dirs; the default keeps the last 3 runs, which turns a
# near-full disk into spurious ENOSPC failures (UB-25).  Retain temp dirs
# only for FAILED runs so a green suite leaves nothing behind (pytest >=7.3).
tmp_path_retention_policy = "failed"
markers = [
    "pretrained: exercises a real pretrained-weight download (needs network; run with UBENCH_ALLOW_DOWNLOADS=1)",
]
