[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Minimal critical ruleset — keeps existing code clean without reformatting.
# Tightening the ruleset is deferred to later phases (R3).
#   E9xx  — runtime errors (syntax errors, invalid escape sequences)
#   F63x  — invalid assert / print statements
#   F7xx  — statement-level errors
#   F82x  — undefined names
select = ["E9", "F63", "F7", "F82"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["codes/tests"]
addopts = "-q"
# Full-suite runs write ~10-15 GB of full-state checkpoints into pytest's
# per-run temp dirs; the default keeps the last 3 runs, which turns a
# near-full disk into spurious ENOSPC failures (UB-25).  Retain temp dirs
# only for FAILED runs so a green suite leaves nothing behind (pytest >=7.3).
tmp_path_retention_policy = "failed"
markers = [
    "pretrained: exercises a real pretrained-weight download (needs network; run with UBENCH_ALLOW_DOWNLOADS=1)",
]
