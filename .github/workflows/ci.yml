name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      # One lock-driven install (UB-20b): the exact pinned closure from the
      # committed CPU lock — torch/torchvision from the PyTorch CPU index via
      # --torch-backend, plus ruff+pytest (the dev extra is compiled into the
      # lock). Replaces the previous two loose `pip install` steps.
      - name: Install from the CPU lockfile
        run: uv pip sync requirements/requirements.cpu.lock --torch-backend=cpu --system

      - name: Lint
        run: ruff check codes/

      - name: Test
        run: pytest codes/tests -x -q
